ShortDescription: Aetox in the terminal — an AI coding desk as a full-screen console.
Description: |-
  Aetox CLI is the coding desk of Aetox as a full-screen terminal console. Type `aetox` in any folder,
  give it a task, and watch the tool calls land above the input; approval cards are answered in place.
  `aetox chat "task"` runs one turn with the answer on stdout, for scripts.
  It uses the Aetox desktop app's engine, keys, chats and memory when the app is installed on the same
  machine, and the engine that ships with it otherwise.
